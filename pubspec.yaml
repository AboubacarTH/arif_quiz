name: arif_quiz
description: A modern Quiz App with Laravel backend
publish_to: 'none'
version: 1.4.0+24

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1

  # Local Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0
  lottie: ^3.5.1
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.5
  flutter_svg: ^2.3.0

  # Social & Sharing
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  # Monétisation — Publicités & Abonnements
  google_mobile_ads: ^9.1.0
  # 3.3.x tire in_app_purchase_android 0.5.x, qui embarque Google Play Billing
  # 8.x — exigé par le Play Store (échéance 31 août 2026).
  in_app_purchase: ^3.3.0

  # Push notifications (rappel défi du jour)
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Animations
  confetti: ^0.8.0

  # File picker (admin Excel import)
  file_picker: ^12.1.2

  # Utilities
  intl: ^0.20.3
  timeago: ^3.7.1
  connectivity_plus: ^7.3.1
  auto_size_text: ^3.0.0
  audioplayers: ^6.8.1

  # Authentification Google (l'ID token obtenu ici est vérifié par le backend)
  google_sign_in: ^7.2.0

  # Internationalisation (UI multilingue en/fr/ar/es)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/arifquiz_512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/images/arifquiz_512.png"

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
